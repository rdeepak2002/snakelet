name: Build and Test

# Trigger on push or pull request to main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out your code
    - uses: actions/checkout@v4

    # 2. Configure CMake (S = source dir, B = build dir)
    - name: Configure CMake
      run: cmake -S . -B build

    # 3. Compile the project
    - name: Build
      run: cmake --build build

    # 4. Run Tests using CTest
    # --output-on-failure is CRITICAL: it prints the logs if a test fails
    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure
